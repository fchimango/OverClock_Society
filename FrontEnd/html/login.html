<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Overclock Society</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/login.css">
    <script src="../js/global-ui.js"></script>
</head>

<body class="auth-page">

    <main class="auth-card">

        <a href="index.html" class="auth-logo" aria-label="Voltar para o início">🎮</a>

        <h1>Entrar</h1>
        <p class="auth-subtitle">Bem-vindo de volta à Overclock Society.</p>

        <form class="auth-form" id="loginForm" novalidate>

            <label>
                E-mail
                <input type="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
            </label>

            <label>
                Senha
                <div class="password-field">
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        data-password-toggle="loginPassword"
                        aria-label="Mostrar senha"
                        aria-controls="loginPassword"
                        aria-pressed="false"
                        title="Mostrar senha"
                    >
                        <svg data-icon-show viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg data-icon-hide viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                            <path d="m3 3 18 18"/>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                            <path d="M9.9 5.2A11.4 11.4 0 0 1 12 5c6.4 0 10 7 10 7a14.7 14.7 0 0 1-3.1 3.8"/>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"/>
                        </svg>
                    </button>
                </div>
            </label>

            <button type="submit" class="btn btn-primary" id="loginSubmit">Entrar</button>

            <p class="auth-feedback" id="loginFeedback" role="status" aria-live="polite"></p>

        </form>

        <section
            class="verification-recovery"
            id="loginVerificationPanel"
            hidden
            aria-labelledby="loginVerificationTitle"
        >
            <h2 id="loginVerificationTitle">Confirme seu e-mail</h2>
            <p class="auth-subtitle">
                Sua conta ainda não foi confirmada. Solicite um novo código para continuar.
            </p>
            <label class="auth-recovery-label">
                E-mail
                <input
                    type="email"
                    id="loginResendEmail"
                    autocomplete="email"
                    placeholder="voce@email.com"
                    required
                >
            </label>
            <button
                type="button"
                class="btn btn-secondary"
                id="loginResendButton"
            >
                Reenviar código
            </button>
            <p
                class="auth-feedback"
                id="loginResendFeedback"
                role="status"
                aria-live="polite"
            ></p>
        </section>

        <p class="auth-switch">
            Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
        </p>

    </main>

    <script src="../js/api-config.js"></script>

    <script src="../js/auth.js"></script>

</body>

</html>
