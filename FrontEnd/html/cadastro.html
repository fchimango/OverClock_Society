<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Crie sua conta na Overclock Society."
    >

    <title>Criar conta | Overclock Society</title>

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>"
    >

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/login.css"
    >
    <script src="../js/global-ui.js"></script>
</head>

<body class="auth-page">

    <main class="auth-card">

        <a
            href="index.html"
            class="auth-logo"
            aria-label="Voltar para o início"
        >
            🎮
        </a>

        <h1>Criar conta</h1>

        <p class="auth-subtitle">
            Entre para a comunidade gamer da faculdade.
        </p>

        <form
            class="auth-form"
            id="registerForm"
            novalidate
        >

            <label>
                Nome

                <input
                    type="text"
                    name="name"
                    placeholder="Seu nome"
                    autocomplete="name"
                    required
                    minlength="2"
                    maxlength="120"
                >
            </label>

            <label>
                Nome de usuário

                <input
                    type="text"
                    name="username"
                    placeholder="Ex.: player_test"
                    autocomplete="username"
                    required
                    minlength="3"
                    maxlength="32"
                    pattern="[A-Za-z0-9._]{3,32}"
                    title="Use de 3 a 32 caracteres: letras, números, ponto ou sublinhado."
                >
            </label>

            <label>
                E-mail

                <input
                    type="email"
                    name="email"
                    placeholder="voce@email.com"
                    autocomplete="email"
                    required
                >
            </label>

            <label>
                Senha

                <div class="password-field">
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Mínimo de 8 caracteres"
                        autocomplete="new-password"
                        required
                        minlength="8"
                        maxlength="50"
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        data-password-toggle="registerPassword"
                        aria-label="Mostrar senha"
                        aria-controls="registerPassword"
                        aria-pressed="false"
                        title="Mostrar senha"
                    >
                        <svg data-icon-show viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg data-icon-hide viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                            <path d="m3 3 18 18"/>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                            <path d="M9.9 5.2A11.4 11.4 0 0 1 12 5c6.4 0 10 7 10 7a14.7 14.7 0 0 1-3.1 3.8"/>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"/>
                        </svg>
                    </button>
                </div>
            </label>

            <label>
                Confirmar senha

                <div class="password-field">
                    <input
                        type="password"
                        id="registerConfirmPassword"
                        name="confirm"
                        placeholder="Repita a senha"
                        autocomplete="new-password"
                        required
                        minlength="8"
                        maxlength="50"
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        data-password-toggle="registerConfirmPassword"
                        aria-label="Mostrar senha"
                        aria-controls="registerConfirmPassword"
                        aria-pressed="false"
                        title="Mostrar senha"
                    >
                        <svg data-icon-show viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg data-icon-hide viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                            <path d="m3 3 18 18"/>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                            <path d="M9.9 5.2A11.4 11.4 0 0 1 12 5c6.4 0 10 7 10 7a14.7 14.7 0 0 1-3.1 3.8"/>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"/>
                        </svg>
                    </button>
                </div>
            </label>

            <button
                type="submit"
                class="btn btn-primary"
                id="registerSubmit"
            >
                Criar conta
            </button>

            <p
                class="auth-feedback"
                id="registerFeedback"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <section
            class="verification-panel"
            id="verificationPanel"
            hidden
            aria-labelledby="verificationTitle"
        >
            <h2 id="verificationTitle">Confirme seu e-mail</h2>
            <p class="auth-subtitle" id="verificationDescription">
                Enviaremos um código de confirmação para o seu e-mail.
            </p>

            <form class="auth-form" id="verificationForm" novalidate>
                <input type="hidden" id="verificationEmail" name="email">

                <label>
                    Código de confirmação
                    <input
                        type="text"
                        id="verificationCode"
                        name="code"
                        placeholder="000000"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        minlength="6"
                        maxlength="6"
                        required
                    >
                </label>

                <button type="submit" class="btn btn-primary" id="verifyEmailSubmit">
                    Confirmar e-mail
                </button>

                <p
                    class="auth-feedback"
                    id="verificationFeedback"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

            <button
                type="button"
                class="auth-secondary-button"
                id="resendVerificationButton"
            >
                Reenviar código
            </button>

            <p
                class="auth-feedback"
                id="resendVerificationFeedback"
                role="status"
                aria-live="polite"
            ></p>
        </section>

        <p class="auth-switch">
            Já tem conta?

            <a href="login.html">
                Entrar
            </a>
        </p>

    </main>

    <script src="../js/api-config.js"></script>

    <script src="../js/auth.js"></script>

</body>
</html>
