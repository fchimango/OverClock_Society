<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Amigos | Overclock Society</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../css/amigos.css"
    >

    <link rel="stylesheet" href="../css/notifications.css">

    <style>
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        .friends-modal.friends-modal-wide { max-width: 620px; text-align: left; }
        .friends-modal-wide > .modal-icon,
        .friends-modal-wide > h2,
        .friends-modal-wide > p { text-align: center; }
        .player-search-input { display: block; width: 100%; box-sizing: border-box; margin: 12px 0 16px; padding: 12px 14px; border: 1px solid rgba(148,163,184,.25); border-radius: 10px; outline: none; background: #0b1220; color: #e2e8f0; font: inherit; }
        .player-search-input:focus { border-color: #A8323B; box-shadow: 0 0 0 3px rgba(168,50,59,.12); }
        .player-search-results { display: flex; flex-direction: column; gap: 9px; max-height: min(44vh, 360px); overflow-y: auto; margin: 12px 0 18px; }
        .player-search-result { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: rgba(15,23,42,.6); }
        .player-search-avatar { display: flex; flex: 0 0 42px; width: 42px; height: 42px; align-items: center; justify-content: center; border-radius: 11px; color: white; font-weight: 800; }
        .player-search-avatar.purple { background: linear-gradient(135deg,#791015,#A8323B); }
        .player-search-avatar.blue { background: linear-gradient(135deg,#2563eb,#38bdf8); }
        .player-search-avatar.pink { background: linear-gradient(135deg,#db2777,#f472b6); }
        .player-search-avatar.green { background: linear-gradient(135deg,#059669,#4ade80); }
        .player-search-avatar.orange { background: linear-gradient(135deg,#ea580c,#f59e0b); }
        .player-search-info { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 3px; }
        .player-search-info strong { color: #e2e8f0; font-size: 13px; }
        .player-search-info span { color: #E6A0A2; font-size: 11px; overflow-wrap: anywhere; }
        .player-search-info small { color: #94a3b8; font-size: 11px; }
        .player-search-action { flex-shrink: 0; padding: 8px 10px; border: 1px solid rgba(168,50,59,.28); border-radius: 8px; background: rgba(121,16,21,.15); color: #F0C4C6; font-size: 11px; font-weight: 700; cursor: pointer; }
        .player-search-action:disabled { opacity: .65; cursor: default; }
        .player-search-state, .friends-empty-state { grid-column: 1 / -1; padding: 18px; border: 1px dashed rgba(148,163,184,.2); border-radius: 12px; color: #94a3b8; text-align: center; font-size: 13px; line-height: 1.6; }
        .player-search-state.error { color: #fca5a5; }
        .friends-api-message { display: none; width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgba(168,50,59,.2); border-radius: 9px; background: rgba(121,16,21,.1); color: #F0C4C6; font-size: 12px; line-height: 1.5; }
        .friends-api-message.visible { display: block; }
        .friends-api-message.error { border-color: rgba(248,113,113,.25); background: rgba(248,113,113,.08); color: #fca5a5; }
        .friends-api-message.success { border-color: rgba(74,222,128,.25); background: rgba(34,197,94,.08); color: #86efac; }
        .request-btn:disabled { opacity: .6; cursor: wait; }
        @media (max-width: 560px) { .friends-modal.friends-modal-wide { padding: 28px 18px; } .player-search-result { flex-wrap: wrap; } .player-search-action { margin-left: 54px; } }
    </style>

    <link rel="stylesheet" href="../css/global-search.css">

    <script src="../js/global-ui.js"></script>
</head>

</html>
